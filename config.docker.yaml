server:
  host: 0.0.0.0
  port: 8000
storage:
  database: data/xflow.db
fetch:
  interval_seconds: 900
  default_limit: 20
  fetcher: mock
sources:
  accounts:
    - username: openai
      limit: 5
  lists: []
  searches: []
agent:
  enabled: true
  importance_threshold: 0.45
  push_threshold: 0.7
telegram:
  enabled: true
  bot_token_env: TELEGRAM_BOT_TOKEN
  chat_id_env: TELEGRAM_CHAT_ID
  send_all: true
  parse_mode: HTML
  disable_web_page_preview: false
