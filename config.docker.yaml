server:
  host: 0.0.0.0
  port: 8000
storage:
  database_url: postgres://xflow:xflow@postgres:5432/xflow
fetch:
  interval_seconds: 900
  default_limit: 5
  fetcher: x_web
  rate_limit_safety_margin: 10
  source_delay_min_seconds: 60
  source_delay_max_seconds: 120
sources:
  accounts:
    - username: openai
      limit: 5
  lists: []
  searches: []
agent:
  enabled: false
  importance_threshold: 0.45
  push_threshold: 0.7
telegram:
  enabled: true
  bot_token_env: TELEGRAM_BOT_TOKEN
  chat_id_env: TELEGRAM_CHAT_ID
  discussion_group_id_env: TELEGRAM_DISCUSSION_GROUP_ID
  send_all: true
  parse_mode: HTML
  disable_web_page_preview: false
comments:
  enabled: true
  max_comments: 20
  spam_keywords:
    - "follow me"
    - "subscribe"
    - "check out my"
    - "free crypto"
    - "airdrop"
    - "click here"
    - "DM me"
    - "NFT giveaway"
    - "mint now"
