services:
  api:
    build: .
    command: xflow serve --config config.docker.yaml
    env_file:
      - .env
    environment:
      - RUST_LOG=xflow=info
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data

  worker:
    build: .
    command: xflow worker --config config.docker.yaml
    env_file:
      - .env
    environment:
      - RUST_LOG=xflow=info
    volumes:
      - ./data:/app/data
