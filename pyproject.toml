[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xflow"
version = "0.1.0"
description = "Self-hosted X/Twitter timeline to RSS/JSON feeds with optional analysis"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "typer>=0.9",
  "PyYAML>=6.0",
  "playwright>=1.40",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0",
  "httpx>=0.27",
]

[project.scripts]
xflow = "xflow.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
